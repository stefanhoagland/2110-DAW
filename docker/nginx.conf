server {
    listen 80;
    listen 443 ssl;
    http2 on;

    ssl_certificate     /config/certs/cert.pem;
    ssl_certificate_key /config/certs/key.pem;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Third-party Web Audio Module plugins: one folder per plugin in
    # /config/plugins. The app reads this listing to fill its plugin menu.
    location /plugins/ {
        alias /config/plugins/;
        autoindex on;
        autoindex_format json;
    }

    # AES67 network audio: a WebSocket to the receiver running in this container.
    location /aes67/ {
        proxy_pass http://127.0.0.1:8067;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
    }
}
